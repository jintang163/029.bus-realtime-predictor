server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bus_predictor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.bus.predictor: DEBUG

traffic:
  amap:
    key: ${AMAP_KEY:}
    enabled: ${AMAP_ENABLED:false}

ml:
  grpc:
    host: ${ML_GRPC_HOST:localhost}
    port: ${ML_GRPC_PORT:50051}
    enabled: ${ML_GRPC_ENABLED:false}
