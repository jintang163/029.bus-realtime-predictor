server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bus_predictor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: bus-predictor-webapi
    export:
      prometheus:
        enabled: true

notification:
  dingtalk:
    webhook: ${DINGTALK_WEBHOOK:}
    secret: ${DINGTALK_SECRET:}
    enabled: ${DINGTALK_ENABLED:false}
  sms:
    enabled: ${SMS_ENABLED:false}
    api-url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.bus.predictor: DEBUG

traffic:
  amap:
    key: ${AMAP_KEY:}
    enabled: ${AMAP_ENABLED:false}

ml:
  grpc:
    host: ${ML_GRPC_HOST:localhost}
    port: ${ML_GRPC_PORT:50051}
    enabled: ${ML_GRPC_ENABLED:false}
