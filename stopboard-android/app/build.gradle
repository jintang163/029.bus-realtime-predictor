plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bus.predictor.stopboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.bus.predictor.stopboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "WS_BASE_URL", "\"ws://192.168.1.100:8080/ws/eta\""
        buildConfigField "String", "API_BASE_URL", "\"http://192.168.1.100:8080/api\""
        buildConfigField "String", "DEFAULT_LINE_CODE", "\"5\""
        buildConfigField "String", "DEFAULT_STATION", "\"人民广场\""
        buildConfigField "String", "DEFAULT_DIRECTION", "\"up\""
        buildConfigField "String", "BOARD_DEVICE_ID", "\"BOARD_001\""
        buildConfigField "boolean", "ENABLE_AUTO_BRIGHTNESS", "true"
        buildConfigField "int", "TTS_MIN_INTERVAL_SECONDS", "30"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // WebSocket client
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'

    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp for HTTP requests (cloud TTS fallback)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines / Async
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
